<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h1>Welcome, {{ email }}</h1>

<a href="/create-ticket">Create Ticket</a>
<br><br>
<a href="/logout">Logout</a>

<br><br>
<form method="GET" action="/search-tickets">
    <input type="text" name="q" placeholder="Search tickets..." required>
    <button type="submit"> Search </button>
</form>
<br>

<hr>
<h2>My Tickets</h2>
{% for ticket in tickets %}
    <div style="border:1px solid black; padding:10px; margin:10px;">
        <h3>{{ ticket.title }}</h3>
        <p>{{ ticket.description }}</p>
        <p>Severity: {{ ticket.severity }}</p>
        <p>Status: {{ ticket.status }}</p>
        <a href="/edit-ticket/{{ ticket.id }}"> Edit Ticket</a>
    </div>
{% endfor %}

</body>
</html>
